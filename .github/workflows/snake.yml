name: Generate Snake

on:
  schedule:
    - cron: "0 17 * * 6"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: an0other
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=FF0000&color_dots=#ffffff,#a8e6a3,#5cd65c,#2eb82e,#145214
            dist/github-contribution-grid-snake-dark.svg?color_snake=00FFFF&color_dots=#000000,#0f5132,#198754,#20c997,#7fffd4

      - name: Deploy to output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: dist
          force_orphan: true
