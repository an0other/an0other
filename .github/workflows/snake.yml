name: Generate Snake

on:
  schedule:
    - cron: "0 17 * * 6"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: an0other
          outputs: |
            # Bản sáng: Hệ xanh lá tươi sáng truyền thống
            dist/github-contribution-grid-snake.svg?color_snake=#4da6ff&color_dots=#ebedf0,#9be9a8,#40c463,#30a14e,#216e39
            # Bản tối: Hệ xanh lục bảo rực rỡ (Khắc phục tình trạng xám đen)
            dist/github-contribution-grid-snake-dark.svg?color_snake=#ffcc00&color_dots=#161b22,#00441b,#006d2c,#238b45,#41ab5d

      - name: Deploy to output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: dist
          force_orphan: true
