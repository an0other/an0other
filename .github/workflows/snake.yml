name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: an0other
          outputs: |
            # Bản sáng: Rắn xanh dương, các ô màu xanh băng dịu
            dist/github-contribution-grid-snake.svg?color_snake=#3c7dd9&color_dots=#ebedf0,#c0e2f8,#81c1ea,#41a0dc,#076196
            # Bản tối: Rắn vàng hổ phách, các ô màu xám than tối giản
            dist/github-contribution-grid-snake-dark.svg?color_snake=#ffb86c&color_dots=#161b22,#21262d,#30363d,#484f58,#6e7681

      - name: Deploy to output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: dist
          force_orphan: true
